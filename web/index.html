<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>五路压差与伺服控制台</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0e1b2d;--line:#223651;--cyan:#41d9c4;--amber:#ffbd5c;--red:#ff6577;--text:#e8f0fa;--muted:#8ea2bc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12304b 0,transparent 30%),var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1280px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}h1{font-size:24px;margin:0;letter-spacing:.04em}.sub{color:var(--muted);margin-top:5px}.status{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%;background:#64748b}.dot.on{background:var(--cyan);box-shadow:0 0 14px var(--cyan)}button,input,select{font:inherit}.btn{border:1px solid var(--line);background:#152943;color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer}.btn:hover{border-color:var(--cyan)}.btn.primary{background:var(--cyan);color:#06221e;border-color:transparent;font-weight:700}.btn.danger{background:var(--red);border:0;color:#240309;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:linear-gradient(145deg,#102036,#0b1727);border:1px solid var(--line);border-radius:12px;padding:16px}.card.bad{border-color:var(--red)}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.pressure{font:700 28px ui-monospace,Consolas,monospace;margin:12px 0 4px}.unit,.temp{color:var(--muted)}canvas{width:100%;height:260px;background:#081321;border-radius:10px;margin-top:14px}.lower{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 15px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#071321;color:var(--text);padding:9px;border-radius:7px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.terminal{height:190px;overflow:auto;background:#040b13;border:1px solid var(--line);border-radius:8px;padding:10px;color:#9dd6ce;font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap}.raw{display:flex;gap:8px;margin-top:9px}.raw input{flex:1}.metric{color:var(--amber)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}}@media(max-width:540px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.grid,.form{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="shell">
  <div class="top"><div><h1>五路压差与伺服控制台</h1><div class="sub">SDP3x × 5 · TCA9548A · ESP32-S3 · P100S</div></div><div class="status"><span id="dot" class="dot"></span><span id="state">未连接</span><button id="connect" class="btn primary">连接串口</button></div></div>
  <section id="cards" class="grid"></section>
  <section class="panel" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><h2>实时压差</h2><span>接收频率 <b id="rate" class="metric">0.0 Hz</b></span></div><canvas id="chart"></canvas></section>
  <div class="lower"><section class="panel"><h2>脉冲模式控制</h2><div class="form">
    <div class="field"><label>目标脉冲数</label><input id="pulses" type="number" value="10000" min="1"></div><div class="field"><label>方向</label><select id="dir"><option value="0">正向</option><option value="1">反向</option></select></div><div class="field"><label>频率 Hz</label><input id="freq" type="number" value="10000"></div><div class="field"><label>加速时间 ms</label><input id="accel" type="number" value="500"></div><div class="field"><label>减速时间 ms</label><input id="decel" type="number" value="500"></div>
    </div><div class="actions"><button class="btn" data-cmd="ENABLE 1">使能</button><button class="btn" data-cmd="ENABLE 0">失能</button><button id="move" class="btn primary">开始运动</button><button class="btn danger" data-cmd="STOP">急停</button><button class="btn" data-cmd="CLEAR">解除急停</button><button class="btn" data-cmd="STATUS">读取状态</button></div>
    <h2 style="margin-top:22px">Modbus RTU 原始操作</h2><div class="form"><div class="field"><label>寄存器地址</label><input id="reg" value="0"></div><div class="field"><label>数值 / 读取数量</label><input id="regValue" value="1"></div></div><div class="actions"><button id="mbRead" class="btn">读取保持寄存器</button><button id="mbWrite" class="btn">写单寄存器</button></div>
  </section><section class="panel"><h2>通信日志</h2><div id="terminal" class="terminal"></div><div class="raw"><input id="raw" placeholder="输入命令，如 STATUS"><button id="send" class="btn">发送</button></div></section></div>
</main><script>
const cards=document.querySelector('#cards');for(let i=0;i<5;i++)cards.insertAdjacentHTML('beforeend',`<article class="card" id="s${i}"><div class="label">传感器 ${i+1} · CH${i}</div><div><span class="pressure">--</span> <span class="unit">Pa</span></div><div class="temp">温度 -- °C</div></article>`);
let port,reader,writer,buffer='',frames=0,lastRate=performance.now(),history=[[],[],[],[],[]];const term=document.querySelector('#terminal');
function log(s){term.textContent+=(term.textContent?'\n':'')+s;term.scrollTop=term.scrollHeight;if(term.textContent.length>12000)term.textContent=term.textContent.slice(-9000)}
async function send(s){if(!writer)return log('尚未连接');await writer.write(new TextEncoder().encode(s.trim()+'\n'));log('> '+s.trim())}
async function connect(){if(!('serial'in navigator))return alert('请使用支持 Web Serial 的 Chrome 或 Edge，并通过 localhost 打开此页面。');port=await navigator.serial.requestPort();await port.open({baudRate:115200});if(port.setSignals)await port.setSignals({dataTerminalReady:false,requestToSend:false,break:false});writer=port.writable.getWriter();document.querySelector('#dot').classList.add('on');document.querySelector('#state').textContent='已连接，等待设备启动';document.querySelector('#connect').textContent='重新连接';readLoop();await new Promise(r=>setTimeout(r,1200));await send('FORMAT JSON');document.querySelector('#state').textContent='已连接'}
async function readLoop(){const decoder=new TextDecoder();reader=port.readable.getReader();try{while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let p;while((p=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,p).trim();buffer=buffer.slice(p+1);if(line)parseLine(line)}}}catch(e){log('读取错误: '+e.message)}finally{reader.releaseLock();document.querySelector('#dot').classList.remove('on');document.querySelector('#state').textContent='已断开'}}
function parseLine(line){if(line[0]!=='{'){log(line);return}try{const d=JSON.parse(line);if(d.type!=='data')return;frames++;if(performance.now()-lastRate>1000){document.querySelector('#rate').textContent=(frames*1000/(performance.now()-lastRate)).toFixed(1)+' Hz';frames=0;lastRate=performance.now()}d.sensors.forEach((s,i)=>{const c=document.querySelector('#s'+i);c.classList.toggle('bad',!s.ok);c.querySelector('.pressure').textContent=s.ok?s.p.toFixed(3):'ERR';c.querySelector('.temp').textContent='温度 '+(s.ok?s.t.toFixed(2):'--')+' °C';history[i].push(s.ok?s.p:null);if(history[i].length>240)history[i].shift()});draw()}catch(e){log('解析失败: '+line)}}
const cv=document.querySelector('#chart'),ctx=cv.getContext('2d'),colors=['#41d9c4','#ffbd5c','#65a7ff','#d98cff','#ff6577'];function draw(){const dpr=devicePixelRatio,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#20344d';ctx.lineWidth=1;for(let y=0;y<=4;y++){ctx.beginPath();ctx.moveTo(0,y*h/4);ctx.lineTo(w,y*h/4);ctx.stroke()}const vals=history.flat().filter(Number.isFinite),min=Math.min(...vals,-1),max=Math.max(...vals,1),span=max-min||1;history.forEach((a,k)=>{ctx.strokeStyle=colors[k];ctx.lineWidth=1.7;ctx.beginPath();a.forEach((v,i)=>{if(v==null)return;const x=i*w/239,y=h-(v-min)/span*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()})}
document.querySelector('#connect').onclick=()=>connect().catch(e=>log('连接失败: '+e.message));document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));document.querySelector('#move').onclick=()=>send(`MOVE ${pulses.value} ${dir.value} ${freq.value} ${accel.value} ${decel.value}`);document.querySelector('#mbRead').onclick=()=>send(`MBREAD ${reg.value} ${regValue.value}`);document.querySelector('#mbWrite').onclick=()=>send(`MBWRITE ${reg.value} ${regValue.value}`);document.querySelector('#send').onclick=()=>{send(raw.value);raw.value=''};document.querySelector('#raw').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#send').click()};
  </script></body></html>
